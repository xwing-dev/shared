syntax = "proto3";

package auth.v1;

service AuthService {
    rpc SendOtp(SendOtpDto) returns (SendOtpResponseDto);
}

message SendOtpDto {
    string identifier = 1;
    oneof type {
        string phone = 2;
        string email = 3;
    }
}

message SendOtpResponseDto {
    string message = 1;
}